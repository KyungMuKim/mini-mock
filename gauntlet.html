<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE GAUNTLET 정답표</title>
<style>
:root{--navy:#0D1B2A;--gold:#C9A227;--red:#C30A15;--cream:#F5F1E8;--line:#d9d4c6}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--cream);color:#1b1b1b;line-height:1.5}
header{background:var(--navy);color:#fff;padding:18px 16px 14px;text-align:center}
header h1{margin:0;font-size:21px;letter-spacing:.12em}
header .vol{color:var(--gold);font-weight:700;font-size:15px;margin-top:2px}
header .sub{font-size:13px;opacity:.85;margin-top:4px}
main{max-width:560px;margin:0 auto;padding:14px 12px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.note{font-size:13.5px;color:#444}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pick a,.tabs button{display:block;text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-weight:700;text-decoration:none;font-size:15px;font-family:inherit;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.tabs button{padding:10px 0;font-size:14px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
h2{font-size:16px;margin:0 0 10px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:6px 0;text-align:center}
.cell .n{font-size:11.5px;color:#777}
.cell .a{font-size:19px;font-weight:700;color:var(--navy)}
.cell.multi .a{color:var(--red);font-size:17px}
.sa{border-top:1px solid var(--line);padding:9px 0;font-size:14.5px}
.sa:first-of-type{border-top:0}
.sa b{color:var(--navy);margin-right:6px}
.sa span{word-break:keep-all}
.hide{filter:blur(7px);user-select:none}
.btn{width:100%;padding:13px;border:0;border-radius:8px;background:var(--gold);color:#1b1b1b;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
footer{text-align:center;font-size:12px;color:#888;margin-top:18px}
.back{display:inline-block;margin-top:8px;font-size:13px;color:#555}
</style>
</head>

    const sa = ans.map((a, k) => ({ a, n: k + 1 })).filter(x => !Array.isArray(x.a));
    const g = el('div', 'grid');
    obj.forEach(x => { const c = el('div', 'cell' + (x.a.length > 1 ? ' multi' : '')); c.appendChild(el('div', 'n', x.n + '번')); c.appendChild(el('div', 'a', x.a.map(v => CIRC[v]).join(''))); g.appendChild(c); });
    inner.appendChild(g);
    if (obj.some(x => x.a.length > 1)) inner.appendChild(el('div', 'note', '<br>빨간색은 정답이 두 개 이상인 문항이에요. 모두 맞아야 정답이에요.'));
    if (sa.length) {
      const sc = el('div'); sc.style.marginTop = '14px';
      sc.appendChild(el('h2', '', '서술형 모범답안'));
      sa.forEach(x => sc.appendChild(el('div', 'sa', '<b>' + x.n + '번</b><span>' + esc(x.a) + '</span>')));
      sc.appendChild(el('div', 'note', '<br>뜻과 조건이 맞는 다른 답은 선생님께 확인받으세요.'));
      inner.appendChild(sc);
    }
    gate.onclick = () => { inner.classList.remove('hide'); gate.remove(); };
    wrap.appendChild(gate); wrap.appendChild(el('div', '', '&nbsp;')); wrap.appendChild(inner);
    body.appendChild(wrap);
  }
  sets.forEach((_, i) => { const b = el('button', '', (i + 1) + '회'); b.onclick = () => render(i); tabs.appendChild(b); });
  render(0);
  const f = el('footer', '', '씨앤씨 · 중1 스탠포드반<br>'); const a = el('a', 'back', '다른 학교 · 다른 권 보기'); a.href = location.pathname; f.appendChild(a); main.appendChild(f);
}
if (!DATA[vol]) pickVolume();
else if (!DATA[vol][school] || DATA[vol][school].hidden) pickSchool();
else show();
</script>
</body>
</html>
